<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAT Controller</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: linear-gradient(145deg, #1a0030, #2d004d);
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.3);
        }
        .login-box h1 {
            color: #a855f7;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }
        .login-box .sub {
            color: #c4b5d4;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            transition: 0.3s;
        }
        .login-box input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .login-box button:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(168, 85, 247, 0.5); }
        .login-box .error {
            color: #ef4444;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🐀 RAT Controller</h1>
        <p class="sub">✦ Vanzzz Remote Access Tool ✦</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
        </form>
    </div>
</body>
</html>
